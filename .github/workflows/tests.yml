# Runs the tests on every push (docs/TESTING.md, section 8).
name: tests

on:
  push:
  pull_request:

jobs:
  everyday:
    name: everyday suite, ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from the requirements files only
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and command-line tests, with coverage
        run: python -m pytest --cov=plane_projection --cov=Ex0 --cov-report=term-missing

  slow:
    name: slow tests, the demo and the benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install from the requirements files only
        run: python -m pip install -r requirements-dev.txt
      - name: Slow tests and the demo on the data set
        run: python -m pytest -m slow
      - name: Speed benchmark (for information; it depends on the machine)
        run: python tools/benchmark.py --rounds 1
        continue-on-error: true
